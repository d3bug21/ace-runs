<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Avatar harness - Ace + Moana x 4 rides</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6f5; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #ui { position: fixed; left: 8px; top: 8px; width: 330px; max-height: calc(100% - 16px); overflow: auto; display: flex; flex-direction: column; gap: 6px; z-index: 2; background: rgba(255,255,255,0.82); border-radius: 10px; padding: 8px; box-sizing: border-box; }
      #ui .row { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
      #ui .lab { font: 700 11px system-ui; color: #456; width: 100%; margin-top: 2px; }
      #ui button { font: 600 11px system-ui; padding: 3px 7px; border-radius: 7px; border: 0; background: #e6eef2; color: #234; cursor: pointer; }
      #ui button.on { background: #2fb5a8; color: #fff; }
      #ui input[type=range] { width: 120px; }
      #ui label { font: 11px system-ui; color: #234; display: flex; align-items: center; gap: 4px; }
      #info { position: fixed; right: 8px; bottom: 8px; font: 12px ui-monospace, monospace; color: #fff; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; z-index: 2; white-space: pre; }
      body.clean #ui, body.clean #info { display: none; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="info"></div>
    <script type="module" src="./avatar.ts"></script>
  </body>
</html>
